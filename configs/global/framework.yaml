# Global framework policy.
#
# Read by framework/config.py; a project states only its overrides in project.yaml.
# There is no version key here: pyproject.toml is the single source for the version.
#
# Paths are not written here. External toolboxes resolve from an environment variable or the
# user-level config, so a clone on another machine is not pinned to this one's drive letters.

framework:
  name: "Eidos"
  description: "Deterministic gates first; a model judges only what the verifiers let through"
  status: "pre-release"        # measured state, not a promise: docs/HEALTH.md

  hardware:
    gpu: "RTX 4070 (12 GB)"
    vram_budget_gb: 10.5       # of 12.3 GB; ~1.8 GB stays with the desktop
    max_concurrent_models: 1
    unload_between_stages: true

  # Knowledge lives in three places and nowhere else. The vector store was removed in 2026-10:
  # a layer with no consumer is deleted, not kept "for later".
  knowledge:
    procedural: "global skill"
    factual: "agent memory"
    historical: "project LESSONS"
    vector_store: false

  quality_gates:
    quantitative:
      name: "BootLoops"
      repo: "https://github.com/BootLoops-ai/bootloops"
      # null means: $BOOTLOOPS_ROOT, then ~/.bootloops/config.json, then the built-in default.
      # A project may pin a path here; the framework does not.
      root: null
      protocols:
        - acceptance-gate
        - planted-truth
        - independence-bookkeeping
        - timing-discipline
        - tool-stewardship
        - lit-review
        - ref-check
        - prose-lint
        - referee-sim
    semantic:
      tools:
        - name: "Inspect"
          license: "MIT"
          purpose: "agent and tool-use evaluation, sandboxed execution"
        - name: "DeepEval"
          license: "Apache-2.0"
          purpose: "pytest-style LLM and RAG assertions"
        - name: "Promptfoo"
          license: "MIT"
          purpose: "config-driven prompt comparison, red-teaming, CI gates"
        - name: "Ragas"
          license: "Apache-2.0"
          purpose: "RAG faithfulness and retrieval metrics"

  # Order matters: identity, then arithmetic, then support. A model may not skip a step.
  verifiers:
    citations:
      tool: "proofpath"
      artefact: "artifacts/literature/proofpath.json"
      states: ["VERIFIED", "BLOCKED", "SOURCE_UNAVAILABLE"]
      fail_closed: true
    statistics:
      tool: "academic-research-kernel"
      artefact: "artifacts/evaluation/stat_recompute.json"
      tolerance: "reported precision, half a unit in the last place; 1e-3 floor"
    support:
      artefact: "artifacts/literature/support/<claim>.json"
      backend: null            # no accessible tool exists; SUPPORT_UNCHECKED until one does
      pass_requires: "passage with source, offsets and matching text"
    reproduction:
      tool: "Paper2Agent (MIT) — toolbox, never evidence"
      requires: ["skill/SKILL.md", "mcp/<repo>-mcp/USAGE.md"]
      artefact: "artifacts/reproduction/<paper>.json"
      verdicts: [MATCH, MISMATCH, UNRUN]
      gate: "S12 — no MATCH, no claim"
    numerics:
      source: "https://arxiv.org/html/2610.31642v3"
      command: "python tools/audit_numerics.py --projects"
      artefact: "docs/NUMERICS.json"
      kernels: ["framework.stable_numerics", "framework.stable_numerics_torch"]
      qualified_dtypes: [float32, float64]
      contract: "independent Decimal references, represented inputs, preserved dtype, relative gradients, negative controls"
      scope: "built-in bounded kernel qualification plus heuristic static screening; each consumer backend requires its own probes"
      exclusions: [AMP, bfloat16, higher_order_backward, full_training_outcomes]
    pointers:
      form: "/artifacts/<file>.json#/json/pointer"
      applies_to: ["S4", "S7"]
      rules:
        statistics: "stat_recompute.json"
        support: "a support record"
        identification: "proofpath.json"
  gates:
    s4:
      verdict_source: "deterministic"   # extract_s4.verdict over a structured record
      record_fields: [power, required, named, adjusted, prereg, declared]
      prose_admissible: false            # extraction from prose reads 7/10 on unseen text
    s4_probe:
      cases: 15                # tests/test_s4_probe.py asserts the count and the rule
      promotion_threshold: 0.90
      model_accuracy_structured: 0.867    # docs/MODEL_VERDICTS.md; below the bar, not promoted
    s7:
      status: "not gateable"             # held-out 17/20 = 0.850 [0.640, 0.948]; tuned 0.950 was ~0.10 optimistic
      constrained_variant: "category fixed by the artefact; model answers support only"
      allowed_use: "draft objections for human review"
      held_out_cases: 20
      held_out_accuracy: 0.85
      wilson95: [0.640, 0.948]
      failure_families: ["significance rationalised", "selection rationalised", "over-strict on clean cases"]
      refuted: "quoting the decisive numbers first made it worse: 36/40 against 38/40"

  human_gates:
    mandatory:
      - "hypothesis_confirmation"
      - "critical_experiment_design"
      - "final_manuscript_submission"
    recommended:
      - "experiment_design"
    optional:
      - "experiment_execution"

  diagnosis:
    enabled: true
    auto_trigger_on_gate_failure: true
    output_format: "structured_report"

  delivery:
    formats: ["latex_pdf", "docx", "html", "code_artifacts"]
    quarto:
      freeze: "auto"
      cache: true

  executable_package:
    docker: true
    binder: true
    freeze_cache: true
    provenance: true

  # Stage-aware scheduling. One model resident at a time: the mutex is a contract, not an
  # intention, and framework/inference/__init__.py refuses a load that would break it.
  inference:
    vram_budget_gb: 10.5
    max_concurrent: 1
    unload_between_stages: true
    models:
      - name: "ScienceRSI-8b-i1-Q4_K_M"
        provider: "llama_cpp"
        quant: "q4_k_m"
        context: 16384         # host preset reduced from 40960; measured 8151 MiB resident
        vram_gb: 6.2           # 6.2 GiB incremental, against 8.1 GiB at 40960
        note: "the reduction saved 2.05 GiB: the 40960 KV cache was bigger than the estimate"
        mutex_with: ["StartLux-Decision-4B-Q8_0"]
        used_for: ["S4", "S7", "hypothesis draft", "diagnosis"]
      - name: "StartLux-Decision-4B-Q8_0"
        provider: "startlux"
        quant: "q8_0"
        context: 16384         # measured from the engine's /props, not from the preset (65536)
        vram_gb: 6.0
        mutex_with: ["ScienceRSI-8b-i1-Q4_K_M"]
        used_for: ["routing", "gate triage", "hypothesis screening"]
      - name: "Qwen3.6-35B-A3B-UD-Q4_K_M"
        provider: "cpu"
        quant: "q4_k_m"
        vram_gb: 9.5
        used_for: ["manuscript", "second opinion"]
      - name: "Qwen3.8-27B-UD-Q4_K_M"
        provider: "cpu"
        quant: "q4_k_m"
        vram_gb: 8.0
        used_for: ["manuscript", "second opinion"]
