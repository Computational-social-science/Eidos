# External project registration -- a pointer, not a copy.
#
# The repository stays where it is: ~80 of its tests import by bare module name,
# its handoff gate hard-codes docs/, and its JSON artefacts are the manuscript's
# data source. Moving it into projects/ would rewrite import paths, break the gate,
# and split one source of truth into two. See the repository's MIGRATION.md §7.3.
#
# What the framework owns here: discovery, execution, one comparable verdict.
# What the project owns: its gate logic, its tests, its manuscript pipeline.

name: keystroke_observatory
root: ../../../keystroke-observatory

# {python} is replaced with the interpreter running the framework, so the project
# is exercised by the same Python that has its dependencies installed.
gate_command: ["{python}", "scripts/check_handoff.py"]
test_command: ["{python}", "-m", "pytest", "tests/", "-q"]
render_command: ["{python}", "main.py", "render"]

reports:
  - docs/MANUSCRIPT.html
  - docs/REPORT.html
  - outputs/rendered/index.pdf

notes: |
  Gate logic, tests and manuscript pipeline stay in this repository; Eidos only
  discovers and invokes it. Contract: Eidos docs/PROJECT_INTEGRATION.md.
