name: surrogate_study
root: ../../reference/surrogate_study

# A fixture, not an external study: the truth is closed-form, so the gate is exercised
# on evidence that cannot drift. Its register supplies the empirical branch (effect size,
# control) that the Lean consumer cannot.
role: reference fixture (synthetic truth)

gate_command: ["python", "build_evidence.py"]
test_command: ["python", "build_evidence.py"]

validity_register: analysis/CLAIMS.yaml
validity_document: "docs/REPORT.md"
