# Gate S register -- negative control (this claim is false on purpose)
#
# The operator consumer proves the gate can pass. It does not prove the gate rejects a
# *false* claim. This fixture states one about the same evidence file: the operator never
# abstains on unanswerable items -- the file says it abstains on all of them. Gate S must
# FAIL, and tests/test_negative_fixture.py asserts that it does.

scope_axes: [model, prompt_shape, items, threshold, non_goals]

scope:
  model: ["StartLux-Decision-v1.1-4B-AutoThink-GGUF, same item set as the operator study"]
  prompt_shape: ["three-way choice, same prompt as the operator study"]
  items: ["100 constructed items, same set"]
  threshold: ["none: the false claim is about abstention, not about a floor"]
  non_goals:
    - "anything true; this register exists to be rejected"

claims:
  - id: N1
    text: "The operator never abstains on items the state cannot answer"
    span: "the operator abstains on none of the unanswerable items"
    strength: supported
    design: preregistered
    evidence:
      file: ../operator_calibration/docs/evidence.json
      pointer: /abstain_unanswerable
      value: 0
    control:
      file: ../operator_calibration/docs/evidence.json
      pointer: /abstain_answerable
      value: 0.0
    assumptions:
      - "none: the asserted number is wrong by construction (1.0, not 0)"
    formal: false

power:
  not_applicable: "the register is a control, not an estimate"

multiplicity:
  not_applicable: "one claim"

