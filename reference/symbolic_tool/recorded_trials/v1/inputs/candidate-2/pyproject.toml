[project]
name = "eidos-symbolic-gradient-qualification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["eidos==0.4.11", "numpy==2.5.4", "sympy==1.14.0", "mpmath==1.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
constraint-dependencies = [
    "contourpy==1.4.0", "cycler==0.12.1", "fonttools==4.67.0",
    "kiwisolver==1.5.1", "matplotlib==3.11.2", "packaging==26.3",
    "pillow==13.0.0", "pyparsing==3.3.3", "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3", "six==1.17.0",
]

[tool.uv.sources]
eidos = { path = "../sdk_process_acceptance/eidos-0.4.11-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
